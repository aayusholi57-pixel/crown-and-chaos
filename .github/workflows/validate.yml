name: Validate Crown & Chaos

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check active 2D battlefield engine
        run: node --check game2d.js
      - name: Check game controller
        run: node --check game.js
      - name: Test autonomous battle movement
        run: node tests/ai-smoke.cjs
      - name: Verify active renderer wiring
        run: |
          grep -q 'src="game2d.js"' index.html
          grep -q 'src="game.js"' index.html
          grep -q 'id="quickBattleBtn"' index.html
          grep -q 'quickBattleBtn' game.js
          grep -q 'aiDifficulty' index.html
          grep -q 'setDifficulty' game2d.js
          grep -q 'rebuildSpatialGrid' game2d.js
          ! grep -q 'src="game3d.js"' index.html
      - name: Verify static site entry point
        run: test -s index.html && test -s styles.css
